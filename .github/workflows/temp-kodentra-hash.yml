name: Temporary Kodentra verify
on:
  push:
    paths:
      - ".github/workflows/temp-kodentra-hash.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and checksums
        shell: bash
        run: |
          set -euo pipefail
          bash -n kodentra-commander/v0.1.1/install-vps.sh
          bash -n kodentra-commander/v0.1.1/scripts/bootstrap-vps.sh
          cat > /tmp/KODENTRA_SHA256SUMS <<'SUMS'
          967975043d2469e6506a515c43ee38e322e0e3e6c7eaacff8367bdc7529363a0  kodentra-commander/v0.1.0/package.json
          6f512c4a893a8b3b871ca1b0abbc5dfc7b3fe31fea9132dfda4e2b344b7227cb  kodentra-commander/v0.1.0/src/common.mjs
          ae08bce231e468f238d39a07358c6e4898d4e0e39aa117db95144ffdc64b014d  kodentra-commander/v0.1.0/src/relay-core.mjs
          6582d997a81887070abea82048f890ee0736ca5b85bd7b59edaec469b586b9c9  kodentra-commander/v0.1.0/src/relay.mjs
          3814553934bf16a7e66f13e38c54b08db82a572648944ac801ef9751b1b9c678  kodentra-commander/v0.1.1/src/agent.mjs
          177a2e294b694ca25417d1fc61c27b47df15b1a78488a8cbae5292f879d5ad8e  kodentra-commander/v0.1.1/src/stdio-session.mjs
          496eeb567bfd9c61eafa23e6a9d8cf8a42c18988390b6d83e7350fab8159263b  kodentra-commander/v0.1.1/deploy/systemd/kodentra-commander-relay.service
          39471ecde86d4027708c0714e521201aee3f4d5452f8d221a761595b46d9802d  kodentra-commander/v0.1.1/deploy/systemd/kodentra-commander-agent.service
          81a211974958e1dda89f5befc785b8c59fc684cea5480de3e592d1308ed4506a  kodentra-commander/v0.1.1/scripts/bootstrap-vps.sh
          SUMS
          sha256sum -c /tmp/KODENTRA_SHA256SUMS
          grep -F '967975043d2469e6506a515c43ee38e322e0e3e6c7eaacff8367bdc7529363a0' kodentra-commander/v0.1.1/install-vps.sh >/dev/null
          grep -F '81a211974958e1dda89f5befc785b8c59fc684cea5480de3e592d1308ed4506a' kodentra-commander/v0.1.1/install-vps.sh >/dev/null
          echo KODENTRA_INSTALLER_VERIFY_PASS
