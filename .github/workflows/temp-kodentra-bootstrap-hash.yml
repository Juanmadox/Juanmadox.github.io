name: Temporary Kodentra bootstrap hash
on:
  push:
    paths:
      - ".github/workflows/temp-kodentra-bootstrap-hash.yml"
jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum kodentra-commander/v0.1.1/scripts/bootstrap-vps.sh

